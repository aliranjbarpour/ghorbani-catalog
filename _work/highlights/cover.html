<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style>
@font-face{font-family:Yekan;src:url(../../assets/fonts/YekanBakhFaNum-Black.woff2) format("woff2");font-weight:900}
@font-face{font-family:Outfit;src:url(../../assets/fonts/outfit-latin-300-normal.woff2) format("woff2");font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#08090b}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0d0e11;font-family:Yekan,sans-serif;color:#f5f6f7}
.sq #c{height:1080px}
.bg{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:saturate(.9)}
.mosaic{position:absolute;inset:-12%;filter:blur(3px) brightness(.62);display:grid;grid-template-columns:repeat(6,1fr);gap:14px;transform:rotate(-10deg)}
.mosaic i{aspect-ratio:1;border-radius:22px;background-size:cover;background-position:center}
.shade{position:absolute;inset:0;background:
  radial-gradient(closest-side at 50% 50%,rgba(8,9,11,.22) 0%,rgba(8,9,11,.45) 62%,rgba(8,9,11,.70) 100%)}
.brand{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 50%,#ff5a4f 0%,#c4232c 45%,#3a0d10 100%)}
.glow{position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,61,71,.20),transparent 70%)}
.mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center}
.mid svg{width:420px;height:420px;overflow:visible;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
.mid svg *{fill:none;stroke:#fff;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.mid img{width:470px;filter:drop-shadow(0 6px 24px rgba(0,0,0,.45))}
.lbl{margin-top:40px;font-size:92px;font-weight:900;line-height:1;white-space:nowrap;text-shadow:0 4px 20px rgba(0,0,0,.5)}
.bar{margin-top:30px;width:120px;height:10px;border-radius:8px;background:linear-gradient(135deg,#ff3d47,#ff7a4d)}
</style></head>
<body><div id="c"></div>
<script>
const P = new URLSearchParams(location.search);
if (P.get("sq")) document.body.classList.add("sq");
const T = "../../assets/img/tex/";
const ICON = {
  // three stacked sheets
  boards: `<svg viewBox="0 0 300 300"><path d="M150 52 268 112 150 172 32 112Z"/><path d="M32 150 150 210 268 150"/><path d="M32 188 150 248 268 188"/></svg>`,
  // log cross-section with growth rings
  wood: `<svg viewBox="0 0 300 300"><path d="M150 30c70 0 122 52 120 118-2 70-56 124-124 122C80 268 30 216 32 148 34 80 84 30 150 30Z"/><path d="M150 72c46 0 80 34 79 77-1 46-38 80-82 79-43-1-75-36-74-79 1-44 33-77 77-77Z"/><path d="M150 112c24 0 40 17 39 39-1 22-19 38-40 37-21-1-36-18-35-39 1-21 16-37 36-37Z"/><path d="M150 30v58"/></svg>`,
  // sparkles
  fantasy: `<svg viewBox="0 0 300 300"><path d="M130 40c8 56 34 82 90 90-56 8-82 34-90 90-8-56-34-82-90-90 56-8 82-34 90-90Z"/><path d="M226 178c4 28 16 40 44 44-28 4-40 16-44 44-4-28-16-40-44-44 28-4 40-16 44-44Z"/><path d="M232 34c3 16 9 22 25 25-16 3-22 9-25 25-3-16-9-22-25-25 16-3 22-9 25-25Z"/></svg>`,
  // swatch fan
  solid: `<svg viewBox="0 0 300 300"><rect x="60" y="40" width="74" height="220" rx="18"/><path d="M134 92l58-34c14-8 30-4 38 10l14 24c8 14 4 30-10 38L134 192"/><path d="M134 190l104-30c16-4 30 4 34 20l6 22c4 16-4 30-20 34L134 260"/><circle cx="97" cy="222" r="10"/></svg>`,
  // gem
  metallic: `<svg viewBox="0 0 300 300"><path d="M90 60h120l60 70-120 130L30 130Z"/><path d="M30 130h240"/><path d="M90 60l26 70 34 130 34-130 26-70"/><path d="M116 130l34-70 34 70"/></svg>`,
  // fluted wall panel
  rumi: `<svg viewBox="0 0 300 300"><rect x="44" y="34" width="212" height="232" rx="16"/><path d="M86 34v232M128 34v232M172 34v232M214 34v232"/></svg>`,
};
const C = {
  intro:   {lbl:"درباره ما",  mosaic:["M213","TM184","M188","M157","RP810H","M19","TM203","M214","M159","RP610H","M202","M180"]},
  boards:  {lbl:"تخته‌ها",    brand:1},
  wood:    {lbl:"طرح چوب",   bg:T+"M213.jpg"},
  fantasy: {lbl:"فانتزی",    bg:T+"M188.jpg"},
  solid:   {lbl:"سالید",     solid:["#A20C3B","#4471B7","#9DB4B3","#000000","#F9EDD3","#626366","#D1C8C4","#838F97","#FFFFFF"]},
  metallic:{lbl:"متالیک",    bg:T+"M159.jpg"},
  rumi:    {lbl:"رومی پنل",  bg:T+"RP810H.jpg"},
};
const k = P.get("k"), c = C[k];
let h = "";
if (c.bg) h += `<div class="bg" style="background-image:url('${c.bg}')"></div>`;
if (c.mosaic) h += `<div class="mosaic">${Array.from({length:72},(_, i)=>`<i style="background-image:url('${T+c.mosaic[(i*5)%c.mosaic.length]}.jpg')"></i>`).join("")}</div>`;
if (c.solid) h += `<div class="mosaic">${Array.from({length:72},(_, i)=>`<i style="background:${c.solid[(i*4)%c.solid.length]}"></i>`).join("")}</div>`;
if (c.brand) h += `<div class="brand"></div>`; else h += `<div class="shade"></div>`;
if (c.glow || k === "intro") h += `<div class="glow"></div>`;
const icon = k === "intro" ? `<img src="../../assets/img/brand/logo-light.png">` : ICON[k];
h += `<div class="mid">${icon}${k==="intro"?"":`<div class="lbl">${c.lbl}</div><div class="bar"${c.brand?' style="background:#fff"':""}></div>`}</div>`;
document.getElementById("c").innerHTML = h;
Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(()=>{}))]).then(() => {
  const urls = c.bg ? [c.bg] : c.mosaic ? c.mosaic.map(m => T+m+".jpg") : [];
  return Promise.all(urls.map(u => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = u; })));
}).then(() => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(r, 400))))).then(() => window.__ready = true);
</script></body></html>
